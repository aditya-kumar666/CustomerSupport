[project]
name = "enterprise-customer-support-agent"
version = "0.1.0"
description = "Day 1 complaint classification agent"
requires-python = ">=3.10"
dependencies = [
    "langgraph>=1.2.24,<2",
    "openai>=1.0,<3",
    "pydantic>=2,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
